services:
  - type: web
    name: smartcrop-ml-api-kushalm8459
    runtime: python
    plan: free
    rootDir: Crop-Recommendation-ML
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main_api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SMARTCROP_SECRET_KEY
        generateValue: true
      - key: SMARTCROP_SPRING_API_URL
        value: https://smartcrop-springboot-api-kushalm8459.onrender.com

  - type: web
    name: smartcrop-springboot-api-kushalm8459
    runtime: docker
    plan: free
    dockerfilePath: ./Crop-Recommendation-ML/springboot/Dockerfile
    dockerContext: ./Crop-Recommendation-ML/springboot
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SMARTCROP_PYTHON_API_URL
        value: https://smartcrop-ml-api-kushalm8459.onrender.com
      - key: SMARTCROP_FRONTEND_ORIGIN
        value: https://smartcrop-ml-api-kushalm8459.onrender.com
